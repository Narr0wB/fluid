[package]
name = "fluid"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = "0.33.11"
half = { version = "2.7.1", features = ["bytemuck"] }
mesh_to_sdf = "0.4.0"
pollster = "1.0.1"
tobj = "4.0.5"
wgpu = "30.0.1"
winit = "0.30.13"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
